<!DOCTYPE html>
<html lang="ar">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-57YXKVXMC3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-57YXKVXMC3');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Space Shooter - تحدي الزعماء اللا نهائي</title>
    <meta name="description" content="العب أقوى لعبة حرب فضاء في المتصفح! واجه الزعماء العملاقة، طور مهاراتك، وحطم الأرقام القياسية في تحدي حماسي لا ينتهي.">
    <meta name="keywords" content="لعبة فضاء, حرب النجوم, ألعاب متصفح, العاب اكشن مجانية, space shooter">
    <meta name="author" content="المطور البطل">

    <style>
        body { margin: 0; background: #000; overflow: hidden; color: white; font-family: sans-serif; }
        canvas { display: block; background: #050505; cursor: crosshair; }
        #ui { position: absolute; top: 20px; left: 20px; font-size: 24px; z-index: 10; line-height: 1.5; }
        #boss-ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 300px; display: none; text-align: center; z-index: 10; }
        #boss-hp-bar { width: 100%; height: 15px; background: #333; border: 1px solid #fff; margin-top: 5px; }
        #boss-hp-fill { width: 100%; height: 100%; background: #00ff00; }
        #warning { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #ff0000; font-size: 60px; display: none; font-weight: bold; text-shadow: 0 0 20px red; z-index: 100; text-align: center; }
        #level-text { font-size: 18px; color: #00d4ff; }
    </style>
</head>
<body>
<div id="start-screen" style="position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;">
    <h1 style="color: #00d4ff; font-size: 50px; text-shadow: 0 0 20px #00d4ff;">Space Shooter</h1>
    <p style="color: white; font-size: 20px;">تحدي الزعماء - نسخة المطور محمود</p>
    <div style="display: flex; gap: 20px; align-items: center; margin-top: 30px;">
        <button id="start-btn" style="padding: 15px 50px; font-size: 25px; cursor: pointer; background: #00ff00; color: black; border: none; border-radius: 10px; font-weight: bold;">START</button>
        <button id="change-color-btn" style="padding: 10px; font-size: 30px; cursor: pointer; background: #555; border: none; border-radius: 50%;">🚀</button>
    </div>
</div>
    <div id="ui">السكور: <span id="score">0</span> <br> <span id="level-text">المستوى: 1</span></div>
    <div id="warning">⚠️ الزعيم قادم! ⚠️</div>
    <div id="boss-ui">
        <div id="boss-name">الزعيم العملاق</div>
        <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    // === جلب العناصر من الـ HTML ===
const startScreen = document.getElementById('start-screen');
const startButton = document.getElementById('start-btn');
const changeColorButton = document.getElementById('change-color-btn');

// === في بداية الكود: تأكد إن اللعبة واقفة ===
// (افترضت إن عندك دالة اسمها gameLoop أو update هي اللي بتشغل اللعبة)
// if (typeof isGameRunning !== 'undefined') { isGameRunning = false; }

startButton.addEventListener('click', () => {
startScreen.style.display = 'none';
gameActive = true;
update();
console.log("Game Started!");
});
// === فعل زرار تغيير اللون (Change Color) ===
changeColorButton.addEventListener('click', () => {
currentColorIndex = (currentColorIndex + 1) % playerColors.length;
changeColorButton.style.backgroundColor = playerColors[currentColorIndex];
console.log("اللون اتغير والزرار نور!");
});
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const levelElement = document.getElementById('level-text');
    const bossUI = document.getElementById('boss-ui');
    const bossHPFill = document.getElementById('boss-hp-fill');
    const warningText = document.getElementById('warning');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let nextBossScore = 200;
    let gameActive = false;
    let isWarning = false;
    let shootingInterval;
    let playerColors = ['#00d4ff', '#12ff00', '#ff00ff', '#ff8800', '#ffffff'];
let currentColorIndex = 0;
    let gameLevel = 1;
    let enemyBaseSpeed = 4;
    let bossMaxHp = 100;
    let bossBaseSpeedX = 4;

    const player = { x: canvas.width / 2, y: canvas.height - 80 };
    const bullets = [];
    const enemies = [];
    const bossBullets = [];
    let boss = null;

    function spawnEnemy() {
        if(!gameActive || boss !== null || isWarning) return;
        enemies.push({
            x: Math.random() * (canvas.width - 40),
            y: -40,
            size: 30,
            speed: enemyBaseSpeed + (Math.random() * 2),
            color: `hsl(${Math.random() * 360}, 70%, 50%)`
        });
    }
    setInterval(spawnEnemy, 700);

    function triggerBoss() {
        isWarning = true;
        warningText.style.display = 'block';
        
        // تسجيل حدث ظهور الزعيم
        gtag('event', 'boss_appeared', {'level': gameLevel});

        setTimeout(() => {
            warningText.style.display = 'none';
            boss = {
                x: canvas.width / 2 - 75,
                y: -100,
                width: 150,
                height: 80,
                hp: bossMaxHp,
                maxHp: bossMaxHp,
                speedX: bossBaseSpeedX,
                lastShot: 0
            };
            bossUI.style.display = 'block';
            isWarning = false;
        }, 3000);
    }

    function update() {
        if (!gameActive) return;

        if (score >= nextBossScore && boss === null && !isWarning) {
            triggerBoss();
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= 15;
            if (bullets[i].y < 0) bullets.splice(i, 1);
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            enemies[i].y += enemies[i].speed;
            if (enemies[i].y + enemies[i].size > player.y && enemies[i].x < player.x + 20 && enemies[i].x + enemies[i].size > player.x - 20) {
                gameOver();
            }
            if (enemies[i].y > canvas.height) enemies.splice(i, 1);
        }

        if (boss) {
            if (boss.y < 80) boss.y += 2;
            boss.x += boss.speedX;
            if (boss.x <= 0 || boss.x + boss.width >= canvas.width) boss.speedX *= -1;

            if (Date.now() - boss.lastShot > 800) {
                bossBullets.push({ x: boss.x + boss.width/2, y: boss.y + boss.height });
                boss.lastShot = Date.now();
            }

            const hpPercent = (boss.hp / boss.maxHp) * 100;
            bossHPFill.style.width = hpPercent + "%";
            bossHPFill.style.background = hpPercent > 50 ? "#00ff00" : "#ff0000";

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                if (b.x > boss.x && b.x < boss.x + boss.width && b.y < boss.y + boss.height) {
                    bullets.splice(i, 1);
                    boss.hp -= 2;
                    if (boss.hp <= 0) {
                        gtag('event', 'boss_defeated', {'level': gameLevel});
                        boss = null;
                        bossUI.style.display = 'none';
                        score += 100;
                        nextBossScore = score + 200;
                        gameLevel++;
                        enemyBaseSpeed += 1.5;
                        bossMaxHp += 70;
                        bossBaseSpeedX += 1.2;
                        levelElement.innerText = "المستوى: " + gameLevel;
                        scoreElement.innerText = score;
                        bossBullets.length = 0;
                        break; 
                    }
                }
            }
        }

        for (let i = bossBullets.length - 1; i >= 0; i--) {
            bossBullets[i].y += 8;
            if (bossBullets[i].y > canvas.height) bossBullets.splice(i, 1);
            if (bossBullets[i] && bossBullets[i].y + 15 > player.y && bossBullets[i].x > player.x - 25 && bossBullets[i].x < player.x + 25) {
                gameOver();
            }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            for (let j = enemies.length - 1; j >= 0; j--) {
                if (bullets[i] && bullets[i].x > enemies[j].x && bullets[i].x < enemies[j].x + enemies[j].size && bullets[i].y < enemies[j].y + enemies[j].size) {
                    enemies.splice(j, 1);
                    bullets.splice(i, 1);
                    score += 10;
                    scoreElement.innerText = score;
                }
            }
        }

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = playerColors[currentColorIndex];
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x - 20, player.y + 30);
        ctx.lineTo(player.x + 20, player.y + 30);
        ctx.fill();

        ctx.fillStyle = 'yellow';
        bullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 15));

        if (boss) {
            ctx.fillStyle = (boss.hp > (boss.maxHp/2)) ? '#00ff00' : '#ff0000';
            ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(boss.x + 25, boss.y + 20, 15, 15);
            ctx.fillRect(boss.x + boss.width - 40, boss.y + 20, 15, 15);
        }

        ctx.fillStyle = '#ff4444';
        bossBullets.forEach(bb => ctx.fillRect(bb.x - 5, bb.y, 15, 15));

        enemies.forEach(en => {
            ctx.fillStyle = en.color;
            ctx.fillRect(en.x, en.y, en.size, en.size);
        });
    }

    function gameOver() {
        gtag('event', 'game_over', {'score': score, 'level': gameLevel});
        gameActive = false;
        alert("انتهى التحدي! السكور: " + score + " | المستوى: " + gameLevel);
        location.reload();
    }

    window.addEventListener('mousemove', (e) => { player.x = e.clientX; });
    window.addEventListener('mousedown', () => {
        if(!gameActive) return;
        bullets.push({ x: player.x, y: player.y });
        shootingInterval = setInterval(() => { bullets.push({ x: player.x, y: player.y }); }, 110);
    });
    window.addEventListener('mouseup', () => { clearInterval(shootingInterval); });

</script>
</body>
</html>
